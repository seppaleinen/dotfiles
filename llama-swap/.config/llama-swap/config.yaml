globalTTL: 300
sendLoadingState: true
healthCheckTimeout: 180
unloadTimeout: 5
startPort: 5800
macros:
  "models_dir": "/home/seppa/models"
  "default_flags": >-
    --cache-type-k q8_0
    --cache-type-v q8_0
  "reasoning": >-
  "llama-bin": "/home/seppa/workspace/llama.cpp/build/bin/llama-server"

models:
  gemma-4-12b:
    concurrencyLimit: 4
    cmdStop: "kill -9 ${PID}"
    cmd: >-
      ${llama-bin} --port ${PORT} -m ${models_dir}/gemma-4-12B/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      -md ${models_dir}/gemma-4-12B/MTP/mtp-gemma-4-12B-it-Q8_0.gguf --spec-type draft-mtp --spec-draft-n-max 4
      -ngl 99 -ngld 99 -b 8192 -ub 4096
      -c 131072 ${default_flags} --reasoning off --reasoning-budget 0
      --flash-attn on --parallel 4 --jinja --cont-batching
      --temp 0.0 --top-p 0.95 --top-k 64

  gemma-4-26b:
    cmd: >-
      ${llama-bin} --port ${PORT} -m ${models_dir}/gemma-4-26B/gemma-4-26B_q4_0-it.gguf
      --model-draft ${models_dir}/gemma-4-26B/mtp-gemma-4-26B-A4B-it.gguf --spec-type draft-mtp --spec-draft-n-max 2
      -c 65536 ${default_flags}
      --parallel 1 --jinja ${reasoning}

  qwen3-8b:
    concurrencyLimit: 4
    cmd: >-
      ${llama-bin} --port ${PORT}
      -m ${models_dir}/models/qwen3-8b/Qwen3-8B-UD-Q6_K_XL.gguf
      -c 131000 --cache-reuse 256 -b 4096 -ub 2048 ${default_flags}
      --flash-attn on --parallel 4 --jinja
      --reasoning off --reasoning-budget 0

  qwen3.5-9b-fable:
    concurrencyLimit: 6
    cmd: >-
      ${llama-bin} --port ${PORT}
      -m ${models_dir}/qwen3.5-9b-fable/Qwen3.5-9B-The-Defiant-Fable-Uncnr-Heretic-NEO-MAX-MTP-Q6_K.gguf
      -c 131072 -b 4096 -ub 1024 ${default_flags} --cache-reuse 256 -ngl 999
      --spec-type draft-mtp --spec-draft-n-max 2 --spec-draft-p-min 0.75
      --reasoning off --reasoning-budget 0
      --flash-attn on --parallel 6 --jinja ${reasoning}

  qwen3.8-27b-gsq-rco:
    concurrencyLimit: 2
    cmd: >-
      ${llama-bin} --port ${PORT}
      -m ${models_dir}/qwen3.8-27b/Qwen3.8-27B-GSQ-RCO-IQ3_XXS-mtp.gguf
      -c 80000 -b 4096 -ub 2048 --cache-reuse 256 -ngl all
      --spec-type draft-mtp --spec-draft-n-max 3 --spec-draft-p-min 0.75
      --flash-attn on --parallel 1 --jinja --reasoning-preserve
      ${default_flags} --chat-template-file ${models_dir}/custom-template.jinja

  qwen3.6-35b:
    cmd: ${llama-bin} --port ${PORT} -m ${models_dir}/qwen3.6-35b/Qwen3.6-35B-A3B-GSQ-hybrid.gguf
      -ngl all --ngld all -b 4096 -ub 2048
      --spec-type draft-mtp --spec-draft-n-max 2 --spec-draft-p-min 0.75
      -c 65536 --cache-type-k q8_0 --cache-type-v q8_0 --no-mmap --mlock
      --flash-attn on --parallel 1 --jinja

  gpt-oss-20b:
    concurrencyLimit: 8
    cmd: >-
      ${llama-bin} --port ${PORT} -m ${models_dir}/gpt-oss-20b/gpt-oss-20b-Q4_K_M.gguf
      -c 131072 -b 4096 -ub 1024 ${default_flags}
      --flash-attn on --parallel 8 --jinja ${reasoning}

  llama3.1-8b:
    concurrencyLimit: 4
    cmdStop: "kill -9 ${PID}"
    cmd: >-
      ${llama-bin} --port ${PORT}
      -m ${models_dir}/llama3.1-8b/Meta-Llama-3.1-8B-Instruct-Q6_K_L.gguf
      -c 65536 --parallel 4
      --cache-type-k q8_0 --cache-type-v q8_0
      -ngl 99 -b 4096 -ub 2048
      --reasoning off --cache-reuse 256 --jinja --flash-attn on
      --temp 0.1 --repeat-penalty 1.05 --presence-penalty 0.0 --min-p 0.05 --top-p 0.9 --top-k 40

  qwen2.5-coder-7b:
    concurrencyLimit: 4
    cmdStop: "kill -9 ${PID}"
    cmd: >-
      ${llama-bin} --port ${PORT}
      -m ${models_dir}/qwen2.5-coder-7b-instruct/qwen2.5-coder-7b-instruct-q6_k.gguf
      -c 65536 --parallel 4
      --cache-type-k q8_0 --cache-type-v q8_0
      -ngl 99
      -b 4096 -ub 2048
      --reasoning off
      --cache-reuse 256 --jinja --flash-attn on ${default_flags}
      --temp 0.1 --repeat-penalty 1.18 --presence-penalty 0.15 --top-p 0.95 --top-k 40

  qwen2.5-7b:
    concurrencyLimit: 4
    cmdStop: "kill -9 ${PID}"
    cmd: >-
      ${llama-bin} --port ${PORT}
      -m ${models_dir}/qwen2.5-7b-instruct/qwen2.5-7b-instruct-q8_0-00001-of-00003.gguf
      --chat-template-file /home/seppa/models/qwen2.5-7b-instruct/qwen2_tools.jinja
      -c 100768 --parallel 4
      --cache-type-k q8_0 --cache-type-v q8_0
      -ngl 99
      -b 4096 -ub 2048
      --reasoning off
      --parallel 4
      --cache-reuse 256 --jinja --flash-attn on ${default_flags}
      --temp 0.2 --top-p 0.95 --top-k 40

  nomic-embed-text-v2:
    cmd: >-
      ${llama-bin} --port ${PORT}
      -m ${models_dir}/nomic-embed-text-v2/nomic-embed-text-v2-moe-q8_0.gguf
      -c 8192 -b 8192 -ub 4096 --parallel 1 --rope-scaling yarn --rope-freq-scale 0.25 ${default_flags} --embeddings

routing:
  router:
    use: group
    settings:
      groups:
        "embeddings":
          swap: false
          exclusive: false
          persistent: true
          members:
            - nomic-embed-text-v2
        "chat":
          swap: true
          exclusive: false
          members:
            - gemma-4-12b
            - gemma-4-26b
            - qwen3.5-9b-fable
            - qwen3.6-35b
            - qwen3.8-27b-gsq-rco
            - gpt-oss-20b
            - qwen2.5-coder-7b
