globalTTL: 300
sendLoadingState: true
healthCheckTimeout: 180
startPort: 5800
macros:
  "models_dir": "/home/seppa/models"
  "default_flags": >-
    --cache-type-k q8_0
    --cache-type-v q8_0
  "reasoning": >-

models:
  gemma-4-12b:
    concurrencyLimit: 3
    cmd: >-
      llama-server --port ${PORT} -m ${models_dir}/gemma-4-12B/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --model-draft ${models_dir}/gemma-4-12B/MTP/mtp-gemma-4-12B-it-Q8_0.gguf --spec-type draft-mtp --spec-draft-n-max 8
      --cache-reuse 256 -ngl 99 -ngld 99 -b 4096 -ub 2048
      -c 163920 ${default_flags} --reasoning off --reasoning-budget 0
      --flash-attn on --parallel 3 --jinja

  gemma-4-26b:
    cmd: >-
      llama-server --port ${PORT} -m ${models_dir}/gemma-4-26B/gemma-4-26B_q4_0-it.gguf
      --model-draft ${models_dir}/gemma-4-26B/mtp-gemma-4-26B-A4B-it.gguf --spec-type draft-mtp --spec-draft-n-max 2
      -c 65536 ${default_flags}
      --parallel 1 --jinja ${reasoning}

  gemma-4-31b:
    cmd: >-
      llama-server --port ${PORT}
      -m ${models_dir}/gemma-4-31B/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
      --model-draft ${models_dir}/gemma-4-31B/mtp-gemma-4-31B-it.gguf --spec-type draft-mtp --spec-draft-n-max 2
      -c 65536 ${default_flags}
      --parallel 1 --jinja ${reasoning} --flash-attn on

  qwen3-8b:
    concurrencyLimit: 4
    cmd: >-
      llama-server --port ${PORT}
      -m ${models_dir}/models/qwen3-8b/Qwen3-8B-UD-Q6_K_XL.gguf
      -c 131000 --cache-reuse 256 -b 4096 -ub 2048 ${default_flags}
      --flash-attn on --parallel 4 --jinja
      --reasoning off --reasoning-budget 0

  qwen3.5-9b-fable:
    concurrencyLimit: 6
    cmd: >-
      llama-server --port ${PORT}
      -m ${models_dir}/qwen3.5-9b-fable/Qwen3.5-9B-The-Defiant-Fable-Uncnr-Heretic-NEO-MAX-MTP-Q6_K.gguf
      -c 131072 -b 4096 -ub 1024 ${default_flags} --cache-reuse 256 -ngl 999
      --spec-type draft-mtp --spec-draft-n-max 2 --spec-draft-p-min 0.75
      --reasoning off --reasoning-budget 0
      --flash-attn on --parallel 6 --jinja ${reasoning}

  qwen3.6-27b:
    cmd: >-
      llama-server --port ${PORT} -m ${models_dir}/qwen3.6-27b/Qwen3.6-27B-UD-Q4_K_XL.gguf
      --spec-type draft-mtp --spec-draft-n-max 2 --spec-draft-p-min 0.75
      -c 65536 --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --parallel 1 --jinja ${default_flags}

  qwen3.6-35b:
    cmd: llama-server --port ${PORT} -m ${models_dir}/qwen3.6-35b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      --spec-type draft-mtp --spec-draft-n-max 2 --spec-draft-p-min 0.75
      -c 65536 --cache-type-k q8_0 --cache-type-v q8_0 --no-mmap --mlock
      --flash-attn on --parallel 1 --jinja ${reasoning}

  gpt-oss-20b:
    concurrencyLimit: 8
    cmd: >-
      llama-server --port ${PORT} -m ${models_dir}/gpt-oss-20b/gpt-oss-20b-Q4_K_M.gguf
      -c 131072 -b 4096 -ub 1024 ${default_flags}
      --flash-attn on --parallel 8 --jinja ${reasoning}

  qwen3.8-27b:
    concurrencyLimit: 1
    cmd: >-
      llama-server --port ${PORT} -m ${models_dir}/qwen3.8-27b/Qwen3.8-27B-Q4_K_M.gguf
      -c 65536 ${default_flags}
      --spec-type draft-mtp --spec-draft-n-max 3 --spec-draft-p-min 0.75
      --flash-attn on --parallel 1 --jinja ${reasoning} --reasoning-format deepseek

  thinkingcap-qwen3.6-27b:
    cmd: >-
      llama-server --port ${PORT} -m ${models_dir}/thinkingcap-qwen3.6-27b/ThinkingCap-Qwen3.6-27B-Q4_K_M.gguf
      -c 65536 ${default_flags}
      --flash-attn on --parallel 1 --jinja ${reasoning}

  qwen2.5-coder-7b:
    concurrencyLimit: 3
    cmd: >-
      llama-server --port ${PORT}
      -m ${models_dir}/qwen2.5-coder-7b-instruct/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf
      --model-draft ${models_dir}/qwen2.5-coder-7b-instruct/Qwen2.5-Coder-0.5B-Instruct-Q8_0.gguf
      --spec-draft-n-max 8
      -c 196608 --parallel 3
      -ngl 99 -ngld 99
      -b 8192 -ub 4096
      --reasoning off --chat-template qwen2.5
      --cache-reuse 256 --jinja --flash-attn on ${default_flags}

  nomic-embed-text-v2:
    cmd: >-
      llama-server --port ${PORT}
      -m ${models_dir}/nomic-embed-text-v2/nomic-embed-text-v2-moe-q8_0.gguf
      -c 4096 -b 2048 -ub 2048 ${default_flags} --embeddings

  llama-3.1-8b-instruct:
    concurrencyLimit: 8
    cmd: >-
      llama-server --port ${PORT}
      -m ${models_dir}/llama-3.1-8b-instruct/Llama-3.1-8B-Instruct-Q6_K.gguf
      -c 163920 ${default_flags} --jinja --flash-attn on
      --parallel 8 -ngl 99 --temp 0.0 --top-p 1.0 --presence-penalty 0.0 --repeat-penalty 1.0
      --batch-size 4096 -ub 1024

routing:
  router:
    use: group
    settings:
      groups:
        "embeddings":
          swap: false
          exclusive: false
          persistent: true
          members:
            - nomic-embed-text-v2
        "chat":
          swap: true
          exclusive: false
          members:
            - gemma-4-12b
            - gemma-4-26b
            - gemma-4-31b
            - qwen3.5-9b-fable
            - qwen3.6-27b
            - qwen3.6-35b
            - qwen3.8-27b
            - thinkingcap-qwen3.6-27b
            - gpt-oss-20b
            - qwen2.5-coder-7b
            - llama-3.1-8b-instruct
