[keybindings]
scroll_up = "ctrl+k"
scroll_down = "ctrl+j"
scroll_page_up = "alt+u"
scroll_page_down = "alt+d"
model_switch_next = "ctrl+tab"
model_switch_prev = "ctrl+shift+tab"
fallback_switch = "ctrl+y"
effort_increase = "alt+right"
effort_decrease = "alt+left"
centered_toggle = "alt+c"
scroll_prompt_up = "ctrl+["
scroll_prompt_down = "ctrl+]"
scroll_bookmark = "ctrl+g"
scroll_up_fallback = ""
scroll_down_fallback = ""
workspace_left = "alt+h"
workspace_down = "alt+j"
workspace_up = "alt+k"
workspace_right = "alt+l"
side_panel_toggle = "alt+m"
copy_selection_toggle = "alt+y"
diagram_pane_toggle = "alt+t"
typing_scroll_lock_toggle = "alt+s"
diff_mode_cycle = "alt+g"
info_widget_toggle = "alt+i"
swarm_panel_focus = "alt+w"
new_terminal = "cmd+shift+;"
open_resume = "cmd+b"
session_picker_enter = "current-terminal"

[dictation]
command = ""
mode = "send"
key = "off"
timeout_secs = 90

[display]
diff_mode = "inline"
queue_mode = false
auto_server_reload = true
mouse_capture = true
debug_socket = false
centered = false
show_thinking = true
reasoning_display = "current"
diagram_mode = "none"
markdown_spacing = "compact"
pin_images = true
idle_animation = false
prompt_entry_animation = true
disabled_animations = []
diff_line_wrap = true
performance = ""
animation_fps = 60
redraw_fps = 60
prompt_preview = true
compact_notifications = false
copy_badge_alt_label = ""
show_agentgrep_output = false

[display.native_scrollbars]
chat = true
side_panel = true

[features]
memory = true
swarm = true
message_timestamps = true
persist_memory_injections = false
kv_cache_miss_notices = true
update_channel = "stable"

[websearch]
engine = "duckduckgo"
fallback_engines = ["bing"]
bing_api_key_env = "JCODE_BING_API_KEY"
bing_market = "en-US"
searxng_url_env = "JCODE_SEARXNG_URL"

[tools]
profile = ""
enabled = []
disabled = []
disable_base_tools = false

[acp]
profile = "standard"
tool_profile = "acp"

[auth]
trusted_external_sources = []
trusted_external_source_paths = [
    "cursor_vscdb|/users/daveri/library/application support/cursor/user/globalstorage/state.vscdb",
    "gemini_cli_oauth_creds|/users/daveri/.gemini/oauth_creds.json",
]

[provider]
openai_reasoning_effort = "low"
openai_service_tier = "priority"
openai_native_compaction_mode = "auto"
openai_native_compaction_threshold_tokens = 200000
preserve_reasoning_context = true
cross_provider_failover = "countdown"
same_provider_account_failover = true
stream_idle_timeout_secs = 180

[providers]

[agents]
swarm_spawn_mode = "inline"
memory_sidecar_enabled = false
memory_rerank_cadence = 0
memory_rerank_votes = 0
memory_rerank_min_agree = 0
memory_embedding_backend = "local"
subagent_timeout_secs = 600

[terminal]

[hooks]
pre_tool_timeout_ms = 5000

[ambient]
enabled = false
allow_api_keys = false
min_interval_minutes = 5
max_interval_minutes = 120
pause_on_active_session = true
proactive_work = true
work_branch_prefix = "ambient/"
visible = true

[safety]
ntfy_server = "https://ntfy.sh"
desktop_notifications = true
email_enabled = false
email_smtp_port = 587
email_imap_port = 993
email_reply_enabled = false
telegram_enabled = false
telegram_reply_enabled = false
discord_enabled = false
discord_reply_enabled = false
jade_relay_enabled = false
jade_relay_reply_enabled = false
jade_relay_launch_enabled = false

[notifications]
turn_complete = true
turn_complete_min_secs = 120
turn_complete_todo_min_secs = 30
turn_complete_only_when_unfocused = true
turn_complete_sound = "Glass"

[gateway]
enabled = false
port = 7643
bind_addr = "0.0.0.0"

[compaction]
mode = "reactive"
lookahead_turns = 15
ewma_alpha = 0.30000001192092896
proactive_floor = 0.4000000059604645
min_samples = 3
stall_window = 5
min_turns_between_compactions = 10
topic_shift_threshold = 0.44999998807907104
relevance_keep_threshold = 0.6499999761581421
goal_window_turns = 5

[power]
prevent_sleep_while_streaming = true

[autoreview]
enabled = false

[autojudge]
enabled = false

[launch_hotkeys]
enabled = true
imported = true

[[launch_hotkeys.entries]]
chord = "cmd+;"
dir = "/Users/daveri/workspace/personal/fleet-infra"
label = "fleet-infra"
self_dev = false

[[launch_hotkeys.entries]]
chord = "cmd+'"
dir = "$HOME"
label = "home"
self_dev = false

# ---- Provider profiles ----

[providers.litellm]
type = "openai-compatible"
base_url = "https://litellm.labb.site/v1"
api_key_env = "MCP_TOKEN"
default_model = "qwen3.6-35b-a3b-mtp"

[providers.remote-ollama]
type = "openai-compatible"
base_url = "http://192.168.1.216:11434/v1"
api_key_env = "MCP_TOKEN"
default_model = "qwen3.6:35b-108k"

[providers.local-lmstudio]
type = "openai-compatible"
base_url = "http://localhost:1234/v1"
default_model = "google/gemma-4-26b-a4b-qat"
